<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'none'">
    <title>Reader</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
    <main id="app">
        <header class="app-bar">
            <button id="open-button" class="icon-button plus-button" type="button" aria-label="Add a book" title="Add a book"></button>
            <div class="title-group">
                <strong id="book-title">Reader</strong>
                <span id="book-progress" aria-live="polite">No book open</span>
            </div>
            <button id="theme-button" class="icon-button" type="button" aria-label="Switch color theme" title="Switch color theme">◐</button>
            <button id="settings-button" class="icon-button" type="button" aria-label="Reading settings" title="Reading settings">Aa</button>
        </header>

        <section id="library" class="library-view" aria-labelledby="library-title">
            <div class="library-heading">
                <div>
                    <h1 id="library-title">Library</h1>
                    <p id="streak-badge" class="streak-badge" aria-live="polite">🔥 0-day reading streak</p>
                </div>
            </div>

            <div id="library-empty" class="library-empty">
                <div class="welcome-mark" aria-hidden="true">Br</div>
                <h2>Your shelf is empty.</h2>
                <p>Add a book stored on this device. Nothing is uploaded.</p>
                <button id="library-empty-button" class="primary-button" type="button">Choose a book</button>
                <p class="formats">EPUB · PDF · MOBI · AZW/AZW3 · FB2/FBZ · CBZ · TXT · HTML</p>
            </div>

            <div id="library-grid" class="library-grid" aria-live="polite"></div>
        </section>

        <section id="reader-shell" class="reader-shell" hidden aria-label="Book reader">
            <div id="reader" class="reader"></div>
            <nav class="reader-nav chapters-unavailable" aria-label="Page navigation">
                <button id="previous-button" class="nav-button" type="button" aria-label="Previous page">←</button>
                <button id="chapters-button" class="nav-button chapters-button" type="button" aria-label="Chapters" title="Chapters" hidden disabled>
                    <span class="menu-icon" aria-hidden="true"></span>
                </button>
                <div id="progress-control" class="progress-control">
                    <output id="progress-tooltip" class="progress-tooltip" hidden></output>
                    <input id="progress-slider" type="range" min="0" max="1" step="0.001" value="0" aria-label="Reading progress">
                </div>
                <button id="next-button" class="nav-button" type="button" aria-label="Next page">→</button>
            </nav>
        </section>

        <input id="file-input" type="file" hidden accept=".epub,.pdf,.djvu,.djv,.mobi,.prc,.azw,.azw3,.fb2,.fbz,.fb2.zip,.cbz,.txt,.text,.md,.html,.htm,.xhtml,application/epub+zip,application/pdf,image/vnd.djvu,application/x-mobipocket-ebook,application/vnd.amazon.ebook,application/vnd.comicbook+zip,application/x-fictionbook+xml,text/plain,text/html">

        <button id="selection-lookup-button" class="primary-button selection-lookup-button" type="button" hidden>Define</button>

        <dialog id="settings-dialog" class="settings-dialog">
            <form method="dialog">
                <header>
                    <h2>Reading settings</h2>
                    <button class="icon-button" value="close" aria-label="Close settings">×</button>
                </header>

                <label class="field">
                    <span>Theme</span>
                    <select id="theme-select">
                        <option value="system">Use device setting</option>
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                        <option value="night">Night</option>
                    </select>
                </label>

                <label class="field">
                    <span>Font</span>
                    <select id="font-select">
                        <option value="publisher">Publisher default</option>
                        <option value="serif">Serif</option>
                        <option value="sans">Sans serif</option>
                        <option value="mono">Monospace</option>
                    </select>
                </label>

                <label class="field range-field">
                    <span>Font size <output id="font-size-output">100%</output></span>
                    <input id="font-size-input" type="range" min="75" max="180" step="5" value="100">
                </label>

                <label class="field range-field">
                    <span>Line spacing <output id="line-height-output">1.5</output></span>
                    <input id="line-height-input" type="range" min="1.2" max="2" step="0.1" value="1.5">
                </label>

                <label class="field toggle-field">
                    <span>
                        <strong>Hide reader controls</strong>
                        <small>Tap the page to show or hide them.</small>
                    </span>
                    <input id="hide-controls-input" type="checkbox">
                </label>
            </form>
        </dialog>

        <dialog id="chapters-dialog" class="settings-dialog chapters-dialog">
            <form method="dialog">
                <header>
                    <h2>Chapters</h2>
                    <button class="icon-button" value="close" aria-label="Close chapters">×</button>
                </header>
                <nav id="chapter-list" class="chapter-list" aria-label="Table of contents"></nav>
            </form>
        </dialog>

        <dialog id="dictionary-dialog" class="settings-dialog dictionary-dialog" aria-labelledby="dictionary-word">
            <form method="dialog">
                <header>
                    <h2 id="dictionary-word">Definition</h2>
                    <button class="icon-button" value="close" aria-label="Close dictionary">×</button>
                </header>
                <div id="dictionary-results" class="dictionary-results" aria-live="polite"></div>
            </form>
        </dialog>

        <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    </main>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
